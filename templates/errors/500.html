{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center">
            <div class="card p-5 border-0 shadow-sm">
                <div class="display-1 text-danger fw-bold mb-3"><i class="bi bi-gear-wide-connected"></i> 500</div>
                <h3 class="fw-bold text-navy mb-2">Internal Server Error</h3>
                <p class="text-muted mb-4">
                    An unexpected server error occurred while processing your request. The transaction has been safely rolled back.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
