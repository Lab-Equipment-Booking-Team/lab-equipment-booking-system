{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center">
            <div class="card p-5 border-0 shadow-sm">
                <div class="display-1 text-warning fw-bold mb-3"><i class="bi bi-question-circle-fill"></i> 404</div>
                <h3 class="fw-bold text-navy mb-2">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The requested laboratory page or equipment item could not be found. It may have been moved, updated, or decommissioned.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('equipment.catalogue') }}" class="btn btn-primary">
                        <i class="bi bi-grid me-1"></i> Equipment Catalogue
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
